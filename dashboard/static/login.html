<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseumGuard — Sign in</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel-2:#1e242c; --line:#2a323c;
    --text:#e6edf3; --muted:#8b98a5; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  button,input{font:inherit; color:inherit}
  .dlg{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; width:min(320px, calc(100vw - 28px))}
  .dlg h1{margin:0 0 4px; font-size:18px}
  .dlg p.sub{margin:0 0 18px; color:var(--muted); font-size:12.5px}
  .dlg label{display:block; font-size:12px; color:var(--muted); margin:12px 0 4px}
  .dlg input{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    padding:7px 9px; border-radius:6px;
  }
  .dlg button{
    width:100%; margin-top:18px; background:var(--accent); border:1px solid var(--accent);
    color:#04121f; font-weight:600; padding:8px 11px; border-radius:6px; cursor:pointer;
  }
  .dlg button:disabled{opacity:.5; cursor:not-allowed}
  .err{color:#ffa198; font-size:12px; margin-top:10px; display:none}
</style>
</head>
<body>

<form class="dlg" id="gateForm">
  <h1>🏛 MuseumGuard</h1>
  <p class="sub">Sign in to view the dashboard.</p>
  <label for="u">Username</label><input id="u" value="viewer" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button type="submit" id="go">Sign in</button>
</form>

<script>
"use strict";
document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go");
  const err = document.getElementById("err");
  btn.disabled = true; err.style.display = "none";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
        cookie: true,
      }),
    });
    const d = await r.json();
    if (d.ok) { location.href = "/"; return; }
    err.textContent = d.error || "Login failed"; err.style.display = "block";
  } catch (_) {
    err.textContent = "Network error"; err.style.display = "block";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
